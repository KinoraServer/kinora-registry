name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check packages
        run: node scripts/build.mjs --check
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Building against what is published catches a change without a new version
      # before it reaches main.
      - name: Fetch the published registry
        run: |
          if git fetch --depth 1 origin published; then
            git worktree add ../published FETCH_HEAD
          else
            mkdir ../published
          fi
      - name: Build
        run: node scripts/build.mjs --previous ../published
