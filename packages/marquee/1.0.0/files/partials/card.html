<div class="mq-card-art">
  <img data-kn-img="backdrop thumb poster" data-kn-size="640">
  <img class="mq-card-logo" data-kn-if="hasLogo" data-kn-img="logo" data-kn-size="320">
  <span class="mq-card-name" data-kn-if="!hasLogo" data-kn-text="title"></span>
  <span class="mq-badge" data-kn-if="isNew">New</span>
  <span class="mq-check" data-kn-if="played" aria-label="Watched"></span>
</div>
<div class="mq-card-info">
  <span class="mq-card-title" data-kn-text="title"></span>
  <span class="mq-card-sub" data-kn-text="subtitle"></span>
</div>
