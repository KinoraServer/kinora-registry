<span class="mq-ep-num" data-kn-text="@number"></span>
<div class="mq-ep-art">
  <img data-kn-img="thumb backdrop" data-kn-size="480">
  <span class="mq-play-icon" aria-hidden="true"></span>
  <div class="mq-progress" data-kn-if="inProgress" data-kn-progress="progress"><i data-kn-fill></i></div>
</div>
<div class="mq-ep-text">
  <p class="mq-ep-head">
    <span class="mq-ep-title" data-kn-text="episodeTitle"></span>
    <span class="mq-ep-time" data-kn-text="runtimeLabel"></span>
  </p>
  <p class="mq-ep-overview" data-kn-text="overview"></p>
</div>
<span class="mq-check" data-kn-if="played" aria-label="Watched"></span>
