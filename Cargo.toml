[workspace]
resolver = "2"
members = ["sdk", "packages/tmdb", "packages/auto-tracks", "packages/activity-log"]

[workspace.package]
edition = "2021"
license = "GPL-2.0-only"
publish = false

[workspace.dependencies]
kinora-module-sdk = { path = "sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Modules are downloaded by every server that installs them: build for size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
